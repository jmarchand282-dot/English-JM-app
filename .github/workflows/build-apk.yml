name: Build JoEnglish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Donner les permissions Gradle
        run: chmod +x gradlew

      - name: Construire l'APK
        run: gradle assembleDebug --stacktrace

      - name: Vérifier que l'APK existe
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERREUR : APK introuvable."
            exit 1
          fi

          echo "APK trouvé :"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Déposer le vrai APK
        uses: actions/upload-artifact@v4
        with:
          name: JoEnglish-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
